name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fatal errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Syntax errors, undefined names, invalid comparisons: the bug class that hid
      # "gw is not defined" in the router for months. Style rules are deliberately not enforced.
      - run: ruff check --select E9,F63,F7,F82 --output-format=github .

  portable:
    name: Portable tests + MXB-Bench routing (Linux, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      MXB_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-ci.txt
      - name: Portable test suites
        run: python scripts/verify_all.py --portable
      - name: MXB-Bench routing (fails the build if accuracy regresses)
        run: python -m bench.run --suite routing --min-precision 0.95 --json bench-routing-${{ matrix.python }}.json --markdown bench-routing-${{ matrix.python }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-routing-py${{ matrix.python }}
          path: bench-routing-*

  windows:
    name: Windows tests
    runs-on: windows-latest
    env:
      MXB_DATA_DIR: ${{ github.workspace }}\.ci-data
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Portable suites on Windows (must pass)
        run: python scripts/verify_all.py --portable
      - name: MXB-Bench routing on Windows
        run: python -m bench.run --suite routing --min-precision 0.95
      # The original v2 suites drive the real mouse, keyboard, OCR, audio and SAPI. Hosted runners
      # have no microphone or speakers and a locked-down desktop, so these are reported but don't
      # block merges until they've been made runner-safe.
      - name: Windows hardware/integration suites (informational)
        continue-on-error: true
        run: python scripts/verify_all.py --windows
